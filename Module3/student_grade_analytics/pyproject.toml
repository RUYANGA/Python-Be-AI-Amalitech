[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "student-analytics"
version = "1.0.0"
description = "Student Grade Analytics Tool using advanced Python collections and SOLID principles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Student Analytics Team" }]
keywords = ["analytics", "statistics", "collections", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
student-analytics = "student_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
# Ruff configuration
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "TCH",  # flake8-type-checking
]
ignore = [
    "D203",  # Conflicts with D211 (no-blank-line-before-class)
    "D213",  # Conflicts with D212 (multi-line-summary-first-line)
    "ANN401",  # Allow typing.Any when explicitly needed
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "ANN",
    "TC001",
    "TC003",
    "E501",
]
"src/student_analytics/__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# --------------------------------------------------------------------------- #
# Black configuration
# --------------------------------------------------------------------------- #
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

# --------------------------------------------------------------------------- #
# Mypy configuration
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true



# --------------------------------------------------------------------------- #
# Pytest configuration
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=student_analytics",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=100",
]

# --------------------------------------------------------------------------- #
# Coverage configuration
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["src/student_analytics"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false
