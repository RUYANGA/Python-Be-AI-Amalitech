# API gateway for auth/shortener/analytics/url-preview. Client traffic only —
# service-to-service calls bypass this and go container-to-container
# directly (they use X-Internal-Token, not a JWT, so auth_request below
# gives them nothing). Bind-mounted as default.conf.template so it
# replaces nginx's own demo default.conf instead of running alongside it.
#
# Every `set $x http://<service>:8000; proxy_pass $x...;` below always
# targets each service's *internal* container port — that's fixed
# regardless of `docker-compose.yml`'s per-service host-port mappings
# (auth:8000, shortener:8001, analytics:8002, url-preview:8003,
# loopback-only, debugging only — see
# ../microservices/README.md#direct-per-service-access-debugging-only).
# This gateway on :8080 is still the only port meant for real client
# traffic: it's the only one that runs auth_request/CORS below — a
# request straight to a service's own port gets neither.

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # ─── CORS (frontend interaction, e.g. a React dev server) ──────────
    # One configurable origin, not a wildcard: once Allow-Credentials/
    # Authorization are in play, "Access-Control-Allow-Origin: *" is
    # unsafe, so this reflects exactly one allowed origin instead. Set at
    # server level with `always` so it's inherited by (and attached to
    # every response code from) every location below, proxied or local —
    # see gateway/README.md#cors-frontend-interaction for the full
    # rationale, including why only the two auth_request-gated locations
    # below need an extra OPTIONS short-circuit. A production setup
    # fronting more than one origin would replace this single value with
    # a `map $http_origin $cors_origin { ... }` allowlist instead.
    add_header 'Access-Control-Allow-Origin' '${CORS_ALLOWED_ORIGIN}' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Type' always;

    # auth_request target only. Forces GET + drops the body (subrequests
    # never carry one); token travels via Authorization header instead.
    location = /internal/verify {
        internal;
        set $auth_verify http://auth:8000;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host auth;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Internal-Token "${INTERNAL_SERVICE_TOKEN}";
        proxy_pass $auth_verify/api/v1/auth/internal/token/validate/;
    }

    # Gateway's own liveness check (docker-compose healthcheck) — whether
    # nginx itself is up, nothing more. Each backend service has its own
    # deeper /health/ (DB + Redis), checked directly by its own container
    # healthcheck, not through here.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # auth_request treats both 401 and 403 as a valid denial.
    error_page 401 403 = @unauthorized;

    location @unauthorized {
        default_type application/json;
        return 401 '{"detail": "Authentication credentials were not provided or are invalid."}';
    }

    location /api/v1/auth/ {
        set $auth_service http://auth:8000;
        proxy_pass $auth_service$request_uri;
    }

    # All four services define docs/schema at the same literal
    # /api/v1/docs/ and /api/v1/schema/ paths, so these give each an
    # unambiguous address (/api/v1/docs/<service>/, /api/v1/schema/<service>/).
    # sub_filter patches Swagger UI's hardcoded root-relative schema fetch to
    # point at the right one; Accept-Encoding "" is required since sub_filter
    # can't match inside gzip.
    location /api/v1/docs/auth/ {
        set $auth_docs http://auth:8000;
        rewrite ^/api/v1/docs/auth/(.*)$ /api/v1/docs/$1 break;
        proxy_set_header Accept-Encoding "";
        sub_filter '/api/v1/schema/' '/api/v1/schema/auth/';
        sub_filter_once off;
        proxy_pass $auth_docs;
    }
    location /api/v1/schema/auth/ {
        set $auth_schema http://auth:8000;
        rewrite ^/api/v1/schema/auth/(.*)$ /api/v1/schema/$1 break;
        proxy_pass $auth_schema;
    }
    location /api/v1/docs/shortener/ {
        set $shortener_docs http://shortener:8000;
        rewrite ^/api/v1/docs/shortener/(.*)$ /api/v1/docs/$1 break;
        proxy_set_header Accept-Encoding "";
        sub_filter '/api/v1/schema/' '/api/v1/schema/shortener/';
        sub_filter_once off;
        proxy_pass $shortener_docs;
    }
    location /api/v1/schema/shortener/ {
        set $shortener_schema http://shortener:8000;
        rewrite ^/api/v1/schema/shortener/(.*)$ /api/v1/schema/$1 break;
        proxy_pass $shortener_schema;
    }
    location /api/v1/docs/analytics/ {
        set $analytics_docs http://analytics:8000;
        rewrite ^/api/v1/docs/analytics/(.*)$ /api/v1/docs/$1 break;
        proxy_set_header Accept-Encoding "";
        sub_filter '/api/v1/schema/' '/api/v1/schema/analytics/';
        sub_filter_once off;
        proxy_pass $analytics_docs;
    }
    location /api/v1/schema/analytics/ {
        set $analytics_schema http://analytics:8000;
        rewrite ^/api/v1/schema/analytics/(.*)$ /api/v1/schema/$1 break;
        proxy_pass $analytics_schema;
    }
    location /api/v1/docs/url-preview/ {
        set $url_preview_docs http://url-preview:8000;
        rewrite ^/api/v1/docs/url-preview/(.*)$ /api/v1/docs/$1 break;
        proxy_set_header Accept-Encoding "";
        sub_filter '/api/v1/schema/' '/api/v1/schema/url-preview/';
        sub_filter_once off;
        proxy_pass $url_preview_docs;
    }
    location /api/v1/schema/url-preview/ {
        set $url_preview_schema http://url-preview:8000;
        rewrite ^/api/v1/schema/url-preview/(.*)$ /api/v1/schema/$1 break;
        proxy_pass $url_preview_schema;
    }

    # Internal endpoints are called directly, service-to-service — never
    # exposed here.
    location /api/v1/internal/ {
        return 404;
    }
    location /internal/ {
        return 404;
    }

    location /api/v1/urls/ {
        # A CORS preflight carries no Authorization header, so letting it
        # reach auth_request below would bounce it with 401 before the
        # browser ever gets the green light to send the real request.
        if ($request_method = OPTIONS) {
            return 204;
        }

        auth_request /internal/verify;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_username $upstream_http_x_username;
        auth_request_set $auth_user_tier $upstream_http_x_user_tier;
        auth_request_set $auth_user_premium $upstream_http_x_user_is_premium;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-Username $auth_username;
        proxy_set_header X-User-Tier $auth_user_tier;
        proxy_set_header X-User-Is-Premium $auth_user_premium;

        set $shortener_service http://shortener:8000;
        proxy_pass $shortener_service$request_uri;
    }

    location /api/v1/analytics/ {
        # See the matching comment in /api/v1/urls/ above.
        if ($request_method = OPTIONS) {
            return 204;
        }

        auth_request /internal/verify;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_username $upstream_http_x_username;
        auth_request_set $auth_user_tier $upstream_http_x_user_tier;
        auth_request_set $auth_user_premium $upstream_http_x_user_is_premium;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-Username $auth_username;
        proxy_set_header X-User-Tier $auth_user_tier;
        proxy_set_header X-User-Is-Premium $auth_user_premium;

        set $analytics_service http://analytics:8000;
        proxy_pass $analytics_service$request_uri;
    }

    # Everything else on shortener: public JSON resolve, and the short
    # link itself (e.g. /abc123).
    location /api/v1/ {
        set $shortener_service http://shortener:8000;
        proxy_pass $shortener_service$request_uri;
    }
    location / {
        set $shortener_service http://shortener:8000;
        proxy_pass $shortener_service$request_uri;
    }
}
