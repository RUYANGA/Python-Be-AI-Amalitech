# Client-traffic-only API gateway for auth/shortener/analytics/url-preview.
server {
    listen 80;
    server_name _;

    client_max_body_size 5m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # CORS — single allowed origin (no wildcard, since credentials are used).
    add_header 'Access-Control-Allow-Origin' '${CORS_ALLOWED_ORIGIN}' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Type' always;

    # auth_request target: token validated by auth over the Authorization header.
    location = /internal/verify {
        internal;
        set $auth_verify http://auth:8000;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host auth;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Internal-Token "${INTERNAL_SERVICE_TOKEN}";
        proxy_pass $auth_verify/api/v1/auth/internal/token/validate/;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 401 403 = @unauthorized;

    location @unauthorized {
        default_type application/json;
        return 401 '{"detail": "Authentication credentials were not provided or are invalid."}';
    }

    location /api/v1/auth/ {
        set $auth_service http://auth:8000;
        proxy_pass $auth_service$request_uri;
    }

    # Per-service Swagger docs/schema. sub_filter rewrites the schema path;
    # Accept-Encoding "" lets sub_filter work on non-gzipped responses.
    location /api/v1/docs/auth/ {
        set $auth_docs http://auth:8000;
        rewrite ^/api/v1/docs/auth/(.*)$ /api/v1/docs/$1 break;
        proxy_set_header Accept-Encoding "";
        sub_filter '/api/v1/schema/' '/api/v1/schema/auth/';
        sub_filter_once off;
        proxy_pass $auth_docs;
    }
    location /api/v1/schema/auth/ {
        set $auth_schema http://auth:8000;
        rewrite ^/api/v1/schema/auth/(.*)$ /api/v1/schema/$1 break;
        proxy_pass $auth_schema;
    }
    location /api/v1/docs/shortener/ {
        set $shortener_docs http://shortener:8000;
        rewrite ^/api/v1/docs/shortener/(.*)$ /api/v1/docs/$1 break;
        proxy_set_header Accept-Encoding "";
        sub_filter '/api/v1/schema/' '/api/v1/schema/shortener/';
        sub_filter_once off;
        proxy_pass $shortener_docs;
    }
    location /api/v1/schema/shortener/ {
        set $shortener_schema http://shortener:8000;
        rewrite ^/api/v1/schema/shortener/(.*)$ /api/v1/schema/$1 break;
        proxy_pass $shortener_schema;
    }
    location /api/v1/docs/analytics/ {
        set $analytics_docs http://analytics:8000;
        rewrite ^/api/v1/docs/analytics/(.*)$ /api/v1/docs/$1 break;
        proxy_set_header Accept-Encoding "";
        sub_filter '/api/v1/schema/' '/api/v1/schema/analytics/';
        sub_filter_once off;
        proxy_pass $analytics_docs;
    }
    location /api/v1/schema/analytics/ {
        set $analytics_schema http://analytics:8000;
        rewrite ^/api/v1/schema/analytics/(.*)$ /api/v1/schema/$1 break;
        proxy_pass $analytics_schema;
    }
    location /api/v1/docs/url-preview/ {
        set $url_preview_docs http://url-preview:8000;
        rewrite ^/api/v1/docs/url-preview/(.*)$ /api/v1/docs/$1 break;
        proxy_set_header Accept-Encoding "";
        sub_filter '/api/v1/schema/' '/api/v1/schema/url-preview/';
        sub_filter_once off;
        proxy_pass $url_preview_docs;
    }
    location /api/v1/schema/url-preview/ {
        set $url_preview_schema http://url-preview:8000;
        rewrite ^/api/v1/schema/url-preview/(.*)$ /api/v1/schema/$1 break;
        proxy_pass $url_preview_schema;
    }

    # Internal service-to-service endpoints are not exposed via the gateway.
    location /api/v1/internal/ {
        return 404;
    }
    location /internal/ {
        return 404;
    }

    # CORS preflight has no Authorization header, so short-circuit it before auth_request.
    location /api/v1/urls/ {
        if ($request_method = OPTIONS) {
            return 204;
        }

        auth_request /internal/verify;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_username $upstream_http_x_username;
        auth_request_set $auth_user_tier $upstream_http_x_user_tier;
        auth_request_set $auth_user_premium $upstream_http_x_user_is_premium;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-Username $auth_username;
        proxy_set_header X-User-Tier $auth_user_tier;
        proxy_set_header X-User-Is-Premium $auth_user_premium;

        set $shortener_service http://shortener:8000;
        proxy_pass $shortener_service$request_uri;
    }

    location /api/v1/analytics/ {
        if ($request_method = OPTIONS) {
            return 204;
        }

        auth_request /internal/verify;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_username $upstream_http_x_username;
        auth_request_set $auth_user_tier $upstream_http_x_user_tier;
        auth_request_set $auth_user_premium $upstream_http_x_user_is_premium;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-Username $auth_username;
        proxy_set_header X-User-Tier $auth_user_tier;
        proxy_set_header X-User-Is-Premium $auth_user_premium;

        set $analytics_service http://analytics:8000;
        proxy_pass $analytics_service$request_uri;
    }

    # Everything else on shortener: public JSON resolve, and the short link (e.g. /abc123).
    location /api/v1/ {
        set $shortener_service http://shortener:8000;
        proxy_pass $shortener_service$request_uri;
    }
    location / {
        set $shortener_service http://shortener:8000;
        proxy_pass $shortener_service$request_uri;
    }
}
