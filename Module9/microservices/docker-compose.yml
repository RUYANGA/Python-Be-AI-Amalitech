
# auth/shortener/analytics/url-preview behind one nginx gateway
# (../gateway). Postgres and Redis are NOT containerized: all four
# connect to the host's own Postgres (host.docker.internal) and Redis
# (host.docker.internal:6380, adjust if yours differs) — create the
# four databases first with `createdb -U <role> auth shortener
# analytics url_preview`. One shared Dockerfile (./Dockerfile) builds
# all four.
#
# Ports: every service gets its own, so nothing collides whether you're
# hitting it through the gateway, directly against its published port,
# or running it bare with `manage.py runserver <port>` outside Docker
# entirely. gateway=8080 (client traffic — the recommended entry point,
# and the *only* one that verifies a JWT/applies CORS), auth=8000,
# shortener=8001, analytics=8002, url-preview=8003. The four services'
# host-port bindings are loopback-only (`127.0.0.1:<port>:8000`) and
# exist for local debugging (`curl localhost:8001/health/`, Swagger UI
# without the gateway's docs-multiplexing rewrite) — going around the
# gateway also goes around its `auth_request` JWT check, so
# shortener/analytics would trust whatever `X-User-*` headers a request
# to their own port sends directly (see
# `apps.<service>.api.authentication.GatewayAuthentication`) instead of
# the gateway-verified ones. Never point a real client (browser, mobile
# app) at a service's own port — only the gateway on :8080 is meant for
# that.
#
# shortener-worker/-beat and analytics-worker are Celery containers:
# shortener runs the nightly archive-expired-URLs job (worker + beat)
# plus the fire-and-forget url-preview fetch dispatched on every URL
# create, analytics runs the write-behind click-ingestion queue (worker
# only — it has no periodic tasks). url-preview has no Celery worker of
# its own — its retry-with-backoff runs synchronously inside the request
# it's handling, not as a background job. All Celery-using services
# share the same Redis instance as the cache/rate-limiter, but each
# service's broker gets its own DB index (CELERY_BROKER_URL below) —
# Celery's redis transport has no per-app key prefix, so two services'
# workers sharing one DB would each BRPOP the *other's* tasks off the
# same queue key.
#
# Quick start:
#   cp .env.example .env   # fill in real secrets + DB_PASSWORD
#   docker compose up --build
#   -> http://localhost:8080/

x-host-db: &host-db
  DB_HOST: host.docker.internal
  DB_PORT: 5432
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?set in .env}

x-extra-hosts: &extra-hosts
  extra_hosts:
    - "host.docker.internal:host-gateway"

# Every container hits the DB migration/health check the same way, so a
# plain "is the process still running" check isn't enough — this is what
# docker-compose's `healthcheck:` actually calls into.
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 15s

x-shortener-env: &shortener-env
  SECRET_KEY: ${SHORTENER_SECRET_KEY:?set in .env}
  DEBUG: ${DEBUG:-True}
  DB_NAME: ${SHORTENER_DB_NAME:-shortener}
  <<: *host-db
  REDIS_URL: redis://host.docker.internal:6380/0
  # A different Redis *DB index* than REDIS_URL above, not just a
  # different key namespace — see the comment on CELERY_BROKER_URL in
  # settings.py for why sharing a DB across services' brokers is unsafe.
  CELERY_BROKER_URL: redis://host.docker.internal:6380/1
  ANALYTICS_SERVICE_URL: http://analytics:8000
  URL_PREVIEW_SERVICE_URL: http://url-preview:8000
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}

x-analytics-env: &analytics-env
  SECRET_KEY: ${ANALYTICS_SECRET_KEY:?set in .env}
  DEBUG: ${DEBUG:-True}
  DB_NAME: ${ANALYTICS_DB_NAME:-analytics}
  <<: *host-db
  REDIS_URL: redis://host.docker.internal:6380/0
  CELERY_BROKER_URL: redis://host.docker.internal:6380/2
  SHORTENER_SERVICE_URL: http://shortener:8000
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}

# No CELERY_BROKER_URL here — url-preview has no Celery worker, unlike
# shortener/analytics above (see the top-of-file comment).
x-url-preview-env: &url-preview-env
  SECRET_KEY: ${URL_PREVIEW_SECRET_KEY:?set in .env}
  DEBUG: ${DEBUG:-True}
  DB_NAME: ${URL_PREVIEW_DB_NAME:-url_preview}
  <<: *host-db
  REDIS_URL: redis://host.docker.internal:6380/0
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
  PREVIEW_FETCH_TIMEOUT: ${PREVIEW_FETCH_TIMEOUT:-5.0}
  PREVIEW_MAX_ATTEMPTS: ${PREVIEW_MAX_ATTEMPTS:-3}
  PREVIEW_RETRY_BASE_DELAY: ${PREVIEW_RETRY_BASE_DELAY:-0.5}
  PREVIEW_MAX_BODY_BYTES: ${PREVIEW_MAX_BODY_BYTES:-2000000}
  PREVIEW_CIRCUIT_FAILURE_THRESHOLD: ${PREVIEW_CIRCUIT_FAILURE_THRESHOLD:-5}
  PREVIEW_CIRCUIT_OPEN_SECONDS: ${PREVIEW_CIRCUIT_OPEN_SECONDS:-60}
  PREVIEW_CACHE_TTL: ${PREVIEW_CACHE_TTL:-600}

services:
  # Loopback-only host port (see the top-of-file comment) — debugging
  # only. Client traffic goes through the gateway.
  auth:
    build:
      context: ./auth
      dockerfile: ../Dockerfile
    image: msvc-auth:latest
    container_name: msvc-auth
    restart: unless-stopped
    <<: *extra-hosts
    environment:
      SECRET_KEY: ${AUTH_SECRET_KEY:?set in .env}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: "*"
      DB_NAME: ${AUTH_DB_NAME:-auth}
      <<: *host-db
      REDIS_URL: redis://host.docker.internal:6380/0
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
    volumes:
      - ./auth/logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]

  shortener:
    build:
      context: ./shortener
      dockerfile: ../Dockerfile
    image: msvc-shortener:latest
    container_name: msvc-shortener
    restart: unless-stopped
    <<: *extra-hosts
    environment:
      <<: *shortener-env
      ALLOWED_HOSTS: "*"
    volumes:
      - ./shortener/logs:/app/logs
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]

  # Runs shortener's own Celery tasks (currently just the nightly
  # archive job — see shortener-beat below). Waits on `shortener` being
  # healthy so migrations have already run against the same database.
  shortener-worker:
    build:
      context: ./shortener
      dockerfile: ../Dockerfile
    image: msvc-shortener-worker:latest
    container_name: msvc-shortener-worker
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=4
    <<: *extra-hosts
    environment:
      <<: *shortener-env
      ALLOWED_HOSTS: "*"
    volumes:
      - ./shortener/logs:/app/logs
    depends_on:
      shortener:
        condition: service_healthy

  # Celery's scheduler: fires archive_expired_urls onto shortener-worker's
  # queue every night at 02:00 (see CELERY_BEAT_SCHEDULE in settings.py).
  # Only ever one of these — Celery Beat is not safe to run more than once.
  shortener-beat:
    build:
      context: ./shortener
      dockerfile: ../Dockerfile
    image: msvc-shortener-beat:latest
    container_name: msvc-shortener-beat
    restart: unless-stopped
    command: celery -A config beat -l info --schedule=/tmp/celerybeat-schedule
    <<: *extra-hosts
    environment:
      <<: *shortener-env
      ALLOWED_HOSTS: "*"
    volumes:
      - ./shortener/logs:/app/logs
    depends_on:
      shortener:
        condition: service_healthy

  analytics:
    build:
      context: ./analytics
      dockerfile: ../Dockerfile
    image: msvc-analytics:latest
    container_name: msvc-analytics
    restart: unless-stopped
    <<: *extra-hosts
    environment:
      <<: *analytics-env
      ALLOWED_HOSTS: "*"
    volumes:
      - ./analytics/logs:/app/logs
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      shortener:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]

  # Write-behind click ingestion: consumes the queue ClickIngestView
  # enqueues onto (track_click_task). No beat here — analytics has no
  # periodic tasks of its own.
  analytics-worker:
    build:
      context: ./analytics
      dockerfile: ../Dockerfile
    image: msvc-analytics-worker:latest
    container_name: msvc-analytics-worker
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=4
    <<: *extra-hosts
    environment:
      <<: *analytics-env
      ALLOWED_HOSTS: "*"
    volumes:
      - ./analytics/logs:/app/logs
    depends_on:
      analytics:
        condition: service_healthy

  # The "external service" in this module: fetches title/description/
  # favicon for a submitted URL, with its own retry-with-backoff and
  # per-domain circuit breaker (see url-preview/README.md). No Celery
  # worker — called directly by shortener over the internal network,
  # and its own resiliency work runs synchronously inside that
  # request, never as a background job. Its host port is loopback-only
  # debugging access same as the others, not a client-facing route —
  # it was never routed through the gateway either.
  url-preview:
    build:
      context: ./url-preview
      dockerfile: ../Dockerfile
    image: msvc-url-preview:latest
    container_name: msvc-url-preview
    restart: unless-stopped
    <<: *extra-hosts
    environment:
      <<: *url-preview-env
      ALLOWED_HOSTS: "*"
    volumes:
      - ./url-preview/logs:/app/logs
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]

  # See ../gateway — the recommended entry point for client traffic
  # (:8080, publicly bindable, unlike the four loopback-only debug
  # ports above): it's the only one that verifies a JWT and applies CORS.
  gateway:
    image: nginx:1.27-alpine
    container_name: msvc-gateway
    restart: unless-stopped
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
    # Mounted as default.conf.template so it replaces nginx's own demo
    # config instead of running alongside it — see ../gateway/README.md.
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "8080:80"
    depends_on:
      auth:
        condition: service_healthy
      shortener:
        condition: service_healthy
      analytics:
        condition: service_healthy
      url-preview:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      # 127.0.0.1, not localhost: busybox wget doesn't fall back from
      # ::1 to 127.0.0.1 the way Python's urllib (used by the three
      # Django services' own healthchecks) does, and nginx here only
      # binds the IPv4 wildcard.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
