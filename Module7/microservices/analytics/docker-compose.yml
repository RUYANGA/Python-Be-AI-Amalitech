# Runs the analytics service completely on its own — its own database.
# Without a shortener service to answer ownership lookups,
# GET /api/v1/analytics/{short_code}/ will fail closed (404) for
# everything — expected in isolation. Point SHORTENER_SERVICE_URL at a
# running shortener (e.g. its own standalone compose on the host, via
# host.docker.internal:8002) if you want the ownership check to work,
# and shortener's ANALYTICS_SERVICE_URL back at this service if you want
# it to receive click events.
#
# Quick start:
#   cp .env.example .env              # then fill in real secrets
#   docker compose up --build
#
# Docs: http://localhost:8003/api/v1/docs/
#
# Token verification happens over REST against a running auth service —
# point AUTH_SERVICE_URL at one (defaults to a standalone auth's
# host.docker.internal:8001; see ../auth/docker-compose.yml).
#
# Note: uses the same container names/ports as ../docker-compose.yml's
# analytics pieces — the two are alternatives, not meant to run at the
# same time.

services:
  db:
    image: postgres:16-alpine
    container_name: msvc-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-analytics}
      POSTGRES_USER: ${DB_USER:-analytics}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
    ports:
      - "5442:5432"
    volumes:
      - analytics_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-analytics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics:
    build: .
    image: msvc-analytics:latest
    container_name: msvc-analytics
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: "*"
      DB_NAME: ${DB_NAME:-analytics}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:8001}
      SHORTENER_SERVICE_URL: ${SHORTENER_SERVICE_URL:-http://host.docker.internal:8002}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
    volumes:
      - ./logs:/app/logs
    ports:
      - "8003:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  analytics_db_data:
