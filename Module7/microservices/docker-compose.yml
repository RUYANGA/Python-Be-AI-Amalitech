
# Microservices split of the Module7 URL shortener: auth, shortener,
# and analytics as three independently deployable Django services, each
# with its own database. Clients talk to each service directly — there
# is no unified gateway/reverse proxy in front of them. Service-to-service
# calls (auth token verification, the shortener ownership lookup, click
# ingestion) all go over plain REST, authenticated with a shared
# INTERNAL_SERVICE_TOKEN header.
#
# Databases are NOT containerized here — all three services connect to
# Postgres running on the host machine (three separate databases: auth,
# shortener, analytics, under one role). Create them once with:
#   createdb -U <role> auth shortener analytics
# and make sure Postgres is listening for TCP connections (listen_addresses
# includes the docker bridge, or '*') — no pg_hba.conf change is needed
# beyond what already allows password auth from localhost, since Docker
# reaches the host via the `host.docker.internal` alias below.
#
# Quick start:
#   cp .env.example .env                # fill in real secrets + DB_PASSWORD
#   docker compose up --build
#
#   auth        http://localhost:8001/api/v1/docs/
#   shortener   http://localhost:8002/api/v1/docs/
#   analytics   http://localhost:8003/api/v1/docs/

# Reusable fragments (YAML anchors) — Compose ignores top-level `x-*`
# keys, so this is the standard place to park them.
x-host-db: &host-db
  DB_HOST: host.docker.internal
  DB_PORT: 5432
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?set in .env}

x-extra-hosts: &extra-hosts
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-analytics-env: &analytics-env
  SECRET_KEY: ${ANALYTICS_SECRET_KEY:?set in .env}
  DEBUG: ${DEBUG:-True}
  DB_NAME: ${ANALYTICS_DB_NAME:-analytics}
  <<: *host-db
  AUTH_SERVICE_URL: http://auth:8000
  SHORTENER_SERVICE_URL: http://shortener:8000
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}

services:
  # ── Shared infrastructure ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: msvc-redis
    restart: unless-stopped
    ports:
      - "6390:6379"
    volumes:
      - msvc_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Auth service ─────────────────────────────────────────────────
  auth:
    build: ./auth
    image: msvc-auth:latest
    container_name: msvc-auth
    restart: unless-stopped
    <<: *extra-hosts
    environment:
      SECRET_KEY: ${AUTH_SECRET_KEY:?set in .env}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: "*"
      DB_NAME: ${AUTH_DB_NAME:-auth}
      <<: *host-db
      REDIS_URL: redis://redis:6379/1
    volumes:
      - ./auth/logs:/app/logs
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy

  # ── Shortener service ────────────────────────────────────────────
  shortener:
    build: ./shortener
    image: msvc-shortener:latest
    container_name: msvc-shortener
    restart: unless-stopped
    <<: *extra-hosts
    environment:
      SECRET_KEY: ${SHORTENER_SECRET_KEY:?set in .env}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: "*"
      DB_NAME: ${SHORTENER_DB_NAME:-shortener}
      <<: *host-db
      REDIS_URL: redis://redis:6379/2
      AUTH_SERVICE_URL: http://auth:8000
      ANALYTICS_SERVICE_URL: http://analytics:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
    volumes:
      - ./shortener/logs:/app/logs
    ports:
      - "8002:8000"
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started

  # ── Analytics service ────────────────────────────────────────────
  analytics:
    build: ./analytics
    image: msvc-analytics:latest
    container_name: msvc-analytics
    restart: unless-stopped
    <<: *extra-hosts
    environment:
      <<: *analytics-env
      ALLOWED_HOSTS: "*"
    volumes:
      - ./analytics/logs:/app/logs
    ports:
      - "8003:8000"
    depends_on:
      shortener:
        condition: service_started
      auth:
        condition: service_started

volumes:
  msvc_redis_data:
