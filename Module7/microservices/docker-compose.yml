
# Microservices split of the Module7 URL shortener: auth, shortener, and
# analytics as three independently deployable Django services, each with
# its own database, sitting behind a single nginx API gateway (../gateway)
# — the only container with a host port published. auth/shortener/analytics
# are reachable only from inside this compose network. The gateway is for
# client-facing traffic only (it centralizes JWT verification via
# auth_request); service-to-service calls — the shortener ownership
# lookup, click ingestion — go directly over this same internal network,
# container-to-container, bypassing the gateway.
#
# One shared Dockerfile (./Dockerfile) builds all three Django services —
# each just points `dockerfile:` at it with its own directory as the build
# context, since they all have the same shape (manage.py, requirements.txt,
# src/).
#
# Databases are NOT containerized here — all three services connect to
# Postgres running on the host machine (three separate databases: auth,
# shortener, analytics, under one role). Create them once with:
#   createdb -U <role> auth shortener analytics
# and make sure Postgres is listening for TCP connections (listen_addresses
# includes the docker bridge, or '*') — no pg_hba.conf change is needed
# beyond what already allows password auth from localhost, since Docker
# reaches the host via the `host.docker.internal` alias below.
#
# Redis is NOT containerized either — all three services connect to a
# Redis instance already running on the host machine, at
# host.docker.internal:6380 (adjust REDIS_URL below if yours is on a
# different port). Nothing here starts or manages that Redis; it must
# already be running and reachable before `docker compose up`.
#
# Quick start:
#   cp .env.example .env                # fill in real secrets + DB_PASSWORD
#   docker compose up --build
#
#   gateway   http://localhost:8080/            (auth, shortener, analytics
#                                                 all live behind this)

# Reusable fragments (YAML anchors) — Compose ignores top-level `x-*`
# keys, so this is the standard place to park them.
x-host-db: &host-db
  DB_HOST: host.docker.internal
  DB_PORT: 5432
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?set in .env}

x-extra-hosts: &extra-hosts
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-analytics-env: &analytics-env
  SECRET_KEY: ${ANALYTICS_SECRET_KEY:?set in .env}
  DEBUG: ${DEBUG:-True}
  DB_NAME: ${ANALYTICS_DB_NAME:-analytics}
  <<: *host-db
  REDIS_URL: redis://host.docker.internal:6380/0
  SHORTENER_SERVICE_URL: http://shortener:8000
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}

services:
  # ── Auth service ─────────────────────────────────────────────────
  # No host port — reachable only via the gateway or from other
  # containers on this network.
  auth:
    build:
      context: ./auth
      dockerfile: ../Dockerfile
    image: msvc-auth:latest
    container_name: msvc-auth
    restart: unless-stopped
    <<: *extra-hosts
    environment:
      SECRET_KEY: ${AUTH_SECRET_KEY:?set in .env}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: "*"
      DB_NAME: ${AUTH_DB_NAME:-auth}
      <<: *host-db
      REDIS_URL: redis://host.docker.internal:6380/0
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
    volumes:
      - ./auth/logs:/app/logs

  # ── Shortener service ────────────────────────────────────────────
  # No host port — reachable only via the gateway or from other
  # containers on this network.
  shortener:
    build:
      context: ./shortener
      dockerfile: ../Dockerfile
    image: msvc-shortener:latest
    container_name: msvc-shortener
    restart: unless-stopped
    <<: *extra-hosts
    environment:
      SECRET_KEY: ${SHORTENER_SECRET_KEY:?set in .env}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: "*"
      DB_NAME: ${SHORTENER_DB_NAME:-shortener}
      <<: *host-db
      REDIS_URL: redis://host.docker.internal:6380/0
      ANALYTICS_SERVICE_URL: http://analytics:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
    volumes:
      - ./shortener/logs:/app/logs
    depends_on:
      auth:
        condition: service_started

  # ── Analytics service ────────────────────────────────────────────
  # No host port — reachable only via the gateway or from other
  # containers on this network.
  analytics:
    build:
      context: ./analytics
      dockerfile: ../Dockerfile
    image: msvc-analytics:latest
    container_name: msvc-analytics
    restart: unless-stopped
    <<: *extra-hosts
    environment:
      <<: *analytics-env
      ALLOWED_HOSTS: "*"
    volumes:
      - ./analytics/logs:/app/logs
    depends_on:
      shortener:
        condition: service_started
      auth:
        condition: service_started

  # ── API gateway ──────────────────────────────────────────────────
  # The only container with a published port — see ../gateway. Routes
  # client and inter-service traffic to auth/shortener/analytics, and
  # centralizes JWT verification via nginx's auth_request module.
  gateway:
    image: nginx:1.27-alpine
    container_name: msvc-gateway
    restart: unless-stopped
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
    # Bind-mounted as default.conf.template (not nginx.conf) so the
    # official image's own envsubst step writes it to
    # /etc/nginx/conf.d/default.conf — replacing the base image's demo
    # server block instead of running alongside it as a second,
    # competing one on the same port. See ../gateway/README.md.
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "8080:80"
    depends_on:
      auth:
        condition: service_started
      shortener:
        condition: service_started
      analytics:
        condition: service_started
