# Runs the shortener service completely on its own — its own Redis.
# Connects to Postgres running on the HOST machine (via
# host.docker.internal) rather than a containerized database — create
# the `shortener` database there once with e.g.
# `createdb -U postgres shortener`. Click events publish over REST to
# whatever ANALYTICS_SERVICE_URL points at; with no analytics service
# reachable, publish attempts just fail (logged, swallowed) and
# redirects/resolves keep working normally.
#
# Quick start:
#   cp .env.example .env              # then fill in real secrets
#   docker compose up --build
#
# Docs: http://localhost:8002/api/v1/docs/
#
# Token verification happens over REST against a running auth service —
# point AUTH_SERVICE_URL at one (defaults to a standalone auth's
# host.docker.internal:8001; see ../auth/docker-compose.yml).
#
# Note: uses the same container names/ports as ../docker-compose.yml's
# shortener pieces — the two are alternatives, not meant to run at the
# same time.

services:
  redis:
    image: redis:7-alpine
    container_name: msvc-shortener-redis
    restart: unless-stopped
    ports:
      - "6392:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  shortener:
    build: .
    image: msvc-shortener:latest
    container_name: msvc-shortener
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: "*"
      DB_NAME: ${DB_NAME:-shortener}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:8001}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://host.docker.internal:8003}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
    volumes:
      - ./logs:/app/logs
    ports:
      - "8002:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
