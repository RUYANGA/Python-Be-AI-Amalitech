# Runs the auth service completely on its own — its own database, its
# own Redis, nothing else required. This is the "one team, one service,
# one repo checkout" way to run it; ../docker-compose.yml is the
# alternative that brings all three services up together for integration
# testing/demos.
#
# Quick start:
#   cp .env.example .env              # then fill in real secrets
#   docker compose up --build
#
# Docs: http://localhost:8001/api/v1/docs/
# Its gRPC token-validation server (for a standalone shortener/analytics
# to verify tokens against): http://localhost:50052
#
# Note: uses the same container names/ports as ../docker-compose.yml's
# auth pieces — the two are alternatives, not meant to run at the same
# time. `docker compose down` whichever one is up before starting the
# other.

services:
  db:
    image: postgres:16-alpine
    container_name: msvc-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-auth}
      POSTGRES_USER: ${DB_USER:-auth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
    ports:
      - "5440:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-auth}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: msvc-auth-redis
    restart: unless-stopped
    ports:
      - "6391:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  auth:
    build: .
    image: msvc-auth:latest
    container_name: msvc-auth
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: "*"
      DB_NAME: ${DB_NAME:-auth}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  # Internal gRPC token-validation server, so a standalone shortener/
  # analytics can point AUTH_GRPC_URL at host.docker.internal:50052.
  auth-grpc:
    image: msvc-auth:latest
    container_name: msvc-auth-grpc
    restart: unless-stopped
    command: ["python", "manage.py", "serve_grpc", "--noreload", "--port", "50052"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      DEBUG: ${DEBUG:-True}
      DB_NAME: ${DB_NAME:-auth}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
    ports:
      - "50052:50052"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  auth_db_data:
