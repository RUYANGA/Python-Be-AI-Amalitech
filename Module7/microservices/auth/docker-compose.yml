# Runs the auth service completely on its own — its own Redis, nothing
# else required. Connects to Postgres running on the HOST machine (via
# host.docker.internal) rather than a containerized database — create
# the `auth` database there once with e.g. `createdb -U postgres auth`.
# This is the "one team, one service, one repo checkout" way to run it;
# ../docker-compose.yml is the alternative that brings all three
# services up together for integration testing/demos.
#
# Quick start:
#   cp .env.example .env              # then fill in real secrets
#   docker compose up --build
#
# Docs: http://localhost:8001/api/v1/docs/
# Its internal token-validation endpoint (for a standalone shortener/
# analytics to verify tokens against): http://localhost:8001/api/v1/auth/internal/token/validate/
#
# Note: uses the same container names/ports as ../docker-compose.yml's
# auth pieces — the two are alternatives, not meant to run at the same
# time. `docker compose down` whichever one is up before starting the
# other.

services:
  redis:
    image: redis:7-alpine
    container_name: msvc-auth-redis
    restart: unless-stopped
    ports:
      - "6391:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  auth:
    build: .
    image: msvc-auth:latest
    container_name: msvc-auth
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: "*"
      DB_NAME: ${DB_NAME:-auth}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
    volumes:
      - ./logs:/app/logs
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
