[project]
name = "social_media"
version = "1.0.0"
description = "Social media backend demo"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.6.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.1.0",
    "email-validator>=2.1.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]



[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG002"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["src/__init__\\.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
